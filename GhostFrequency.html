<style>
/* ═══════════════════════════════════════════
   GHOST FREQUENCY — v1.1.4
   Zero-dollar haunted radio
   ═══════════════════════════════════════════ */

:root {
  --phosphor: #00ff41;
  --phosphor-dim: #00aa2a;
  --phosphor-glow: rgba(0, 255, 65, 0.4);
  --amber: #ffb000;
  --red: #ff3333;
  --bg: #050505;
  --screen-bg: #0a0f0a;
  --knob-size: min(180px, 40vw);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

@font-face {
  font-family: 'VT323';
  src: local('VT323'), local('Courier New');
}

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Courier New', 'VT323', monospace;
  color: var(--phosphor);
  user-select: none;
  -webkit-user-select: none;
}

body {
  padding-bottom: 60px; /* Reserves space for the AdMob banner */
}

/* ─── CRT OVERLAY ─── */
#crt-overlay {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 9999;
  background:
    radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  background-size: 100% 100%, 100% 4px;
}
#crt-overlay.hidden { display: none; }
#crt-overlay::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,20,0,0.3) 100%);
  animation: flicker 0.15s infinite;
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.97; }
}

/* ─── POWER-ON SEQUENCE ─── */
#power-screen {
  position: fixed; inset: 0;
  background: #000;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 1.5s ease;
}
#power-screen.off { opacity: 0; pointer-events: none; }
.power-text {
  font-size: clamp(14px, 3vw, 24px);
  letter-spacing: 4px;
  text-transform: uppercase;
  animation: powerPulse 2s ease-in-out infinite;
  text-shadow: 0 0 10px var(--phosphor-glow);
}
@keyframes powerPulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
.power-bar {
  width: min(300px, 70vw);
  height: 4px;
  background: #111;
  margin-top: 30px;
  position: relative;
  overflow: hidden;
}
.power-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--phosphor);
  box-shadow: 0 0 10px var(--phosphor);
  animation: powerFill 2.5s ease-out forwards;
}
@keyframes powerFill { to { width: 100%; } }

/* ─── MAIN RADIO CHASSIS ─── */
#radio {
  width: 100%; height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
}

/* ─── TOP: FREQ DISPLAY ─── */
#freq-section {
  flex: 0 0 auto;
  padding: 12px 8px 6px;
  text-align: center;
  border-bottom: 1px solid rgba(0,255,65,0.1);
  position: relative;
}
/* Watermark/Logo badge on header for screenshots */
#app-brand-badge {
  font-size: 8px;
  letter-spacing: 3px;
  opacity: 0.7;
  color: var(--amber);
  text-transform: uppercase;
  margin-bottom: 2px;
  text-shadow: 0 0 5px rgba(255,176,0,0.3);
}
#freq-label {
  font-size: 9px;
  letter-spacing: 5px;
  opacity: 0.5;
  margin-bottom: 2px;
}
#freq-display {
  font-size: clamp(32px, 9vw, 64px);
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 0 0 20px var(--phosphor-glow), 0 0 40px var(--phosphor-glow);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
#freq-display .mhz {
  font-size: 0.4em;
  opacity: 0.6;
  margin-left: 4px;
}

/* ─── SIGNAL METER ─── */
#meter-section {
  flex: 0 0 auto;
  padding: 6px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
#meter-label {
  font-size: 9px;
  letter-spacing: 3px;
  opacity: 0.5;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}
#meter {
  flex: 1;
  height: 20px;
  background: #0a0a0a;
  border: 1px solid rgba(0,255,65,0.2);
  position: relative;
  overflow: hidden;
}
#meter-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--phosphor-dim), var(--phosphor));
  box-shadow: 0 0 15px var(--phosphor-glow);
  transition: width 0.15s ease-out;
  position: relative;
}
#meter-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 3px;
  background: #fff;
  box-shadow: 0 0 8px #fff;
}
.meter-ticks {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 4px;
  pointer-events: none;
}
.meter-tick {
  width: 1px;
  height: 100%;
  background: rgba(0,255,65,0.15);
}

/* ─── CENTER: MESSAGE DISPLAY (THE SCREEN) ─── */
#screen-section {
  flex: 1;
  min-height: 0;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  position: relative;
}
#message-screen {
  flex: 1;
  background: var(--screen-bg);
  border: 1px solid rgba(0,255,65,0.15);
  border-radius: 4px;
  padding: 16px;
  overflow-y: auto;
  position: relative;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
}
#message-screen::-webkit-scrollbar { width: 4px; }
#message-screen::-webkit-scrollbar-thumb { background: var(--phosphor-dim); }

/* Persistent Watermark inside the screenshot viewing area */
#screen-watermark {
  position: absolute;
  bottom: 12px;
  right: 14px;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--phosphor);
  opacity: 0.25;
  pointer-events: none;
  font-weight: bold;
  z-index: 10;
  text-shadow: 0 0 8px var(--phosphor-glow);
}

.message {
  margin-bottom: 16px;
  padding: 10px 12px;
  border-left: 2px solid var(--phosphor-dim);
  background: rgba(0,255,65,0.03);
  position: relative;
  animation: msgIn 0.3s ease-out;
  word-break: break-word;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.message.interference {
  border-left-color: var(--red);
  background: rgba(255,51,51,0.05);
  color: var(--red);
}
.message.echo {
  border-left-color: var(--amber);
  background: rgba(255,176,0,0.05);
  color: var(--amber);
}
.message .meta {
  font-size: 9px;
  opacity: 0.5;
  margin-bottom: 4px;
  display: flex;
  gap: 10px;
}
.message .content {
  font-size: 15px;
  line-height: 1.5;
  text-shadow: 0 0 5px var(--phosphor-glow);
}
.message .decay-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--phosphor-dim);
  transform-origin: left;
}
.message.interference .content {
  animation: interferenceShake 0.1s infinite;
}
@keyframes interferenceShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-1px); }
  75% { transform: translateX(1px); }
}

#dead-air {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.15;
  font-size: 12px;
  letter-spacing: 4px;
  pointer-events: none;
}

/* ─── TUNING KNOB ─── */
#knob-section {
  flex: 0 0 auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}
#knob-container {
  position: relative;
  width: var(--knob-size);
  height: var(--knob-size);
}
#knob {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #2a2a2a, #0a0a0a);
  border: 3px solid #1a1a1a;
  box-shadow:
    0 4px 20px rgba(0,0,0,0.8),
    inset 0 2px 5px rgba(255,255,255,0.05);
  position: relative;
  cursor: grab;
  touch-action: none;
}
#knob:active { cursor: grabbing; }
#knob::before {
  content: '';
  position: absolute;
  top: 8%; left: 50%;
  width: 4px;
  height: 25%;
  background: var(--phosphor);
  transform: translateX(-50%);
  border-radius: 2px;
  box-shadow: 0 0 8px var(--phosphor);
}
#knob::after {
  content: '';
  position: absolute;
  inset: 15%;
  border-radius: 50%;
  border: 1px solid rgba(0,255,65,0.1);
}
.knob-tick {
  position: absolute;
  width: 2px;
  height: 8px;
  background: #333;
  left: 50%;
  transform-origin: 50% calc(var(--knob-size) / 2);
}

/* ─── SCAN BUTTON ─── */
#scan-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid var(--phosphor-dim);
  background: transparent;
  color: var(--phosphor);
  font-family: inherit;
  font-size: 9px;
  letter-spacing: 2px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: all 0.2s;
}
#scan-btn:hover, #scan-btn.active {
  background: var(--phosphor);
  color: #000;
  box-shadow: 0 0 20px var(--phosphor-glow);
}
#scan-btn:active { transform: scale(0.95); }

/* ─── PTT BUTTON ─── */
#ptt-section {
  flex: 0 0 auto;
  padding: 8px 16px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-end;
}
#ptt-btn {
  flex: 1;
  height: 56px;
  border: 2px solid var(--phosphor-dim);
  background: rgba(0,255,65,0.05);
  color: var(--phosphor);
  font-family: inherit;
  font-size: 15px;
  letter-spacing: 5px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  transition: all 0.1s;
  touch-action: none;
}
#ptt-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--phosphor);
  opacity: 0;
  transition: opacity 0.1s;
}
#ptt-btn:active::before, #ptt-btn.active::before { opacity: 0.15; }
#ptt-btn:active, #ptt-btn.active {
  border-color: var(--phosphor);
  box-shadow: 0 0 30px var(--phosphor-glow);
  transform: scale(0.98);
}
#ptt-btn span { position: relative; z-index: 1; }

.voice-play-btn {
  background: transparent;
  border: 1px solid var(--phosphor);
  color: var(--phosphor);
  font-family: inherit;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
  margin-top: 8px;
  width: 100%;
}
.voice-play-btn:hover {
  background: var(--phosphor);
  color: #000;
}

/* ─── TEXT INPUT ─── */
#msg-input {
  flex: 1;
  height: 56px;
  background: #0a0f0a;
  border: 1px solid rgba(0,255,65,0.2);
  color: var(--phosphor);
  font-family: inherit;
  font-size: 15px;
  padding: 8px 12px;
  border-radius: 4px;
  outline: none;
  resize: none;
  display: none;
}
#msg-input::placeholder { color: rgba(0,255,65,0.2); }
#msg-input:focus {
  border-color: var(--phosphor);
  box-shadow: 0 0 10px var(--phosphor-glow);
}

/* ─── STATUS BAR ─── */
#status-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 4px 12px;
  font-size: 9px;
  letter-spacing: 2px;
  opacity: 0.4;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 100;
}

/* ─── SETUP MODAL ─── */
#setup-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 5000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#setup-modal.show { display: flex; }
.setup-box {
  border: 1px solid var(--phosphor-dim);
  background: var(--bg);
  padding: 24px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 0 40px rgba(0,255,65,0.1);
  max-height: 90vh;
  overflow-y: auto;
}
.setup-box h2 {
  font-size: 16px;
  letter-spacing: 4px;
  margin-bottom: 12px;
  text-shadow: 0 0 10px var(--phosphor-glow);
}
.setup-box label {
  font-size: 11px;
  letter-spacing: 2px;
  opacity: 0.7;
  display: block;
  margin-bottom: 4px;
  margin-top: 10px;
}
.setup-box input[type="text"] {
  width: 100%;
  background: #0a0f0a;
  border: 1px solid rgba(0,255,65,0.2);
  color: var(--phosphor);
  font-family: inherit;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 13px;
  outline: none;
}
.setup-box input:focus { border-color: var(--phosphor); }
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 12px 0;
  font-size: 12px;
  letter-spacing: 1px;
}
.setting-row input[type="checkbox"] {
  accent-color: var(--phosphor);
  width: 18px;
  height: 18px;
  cursor: pointer;
}
.setup-box button {
  width: 100%;
  padding: 12px;
  background: var(--phosphor);
  color: #000;
  border: none;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
}
.setup-box button:hover { box-shadow: 0 0 20px var(--phosphor-glow); }
.setup-box .btn-secondary {
  background: transparent;
  border: 1px solid var(--phosphor);
  color: var(--phosphor);
}
.setup-box .btn-secondary:hover {
  background: var(--phosphor);
  color: #000;
}
.setup-box .btn-close {
  background: transparent;
  border: 1px solid #444;
  color: #888;
}
.setup-box .btn-close:hover {
  border-color: var(--red);
  color: var(--red);
  box-shadow: 0 0 10px rgba(255,51,51,0.3);
}

/* ─── HOT SIGNAL OVERLAY ─── */
#hot-signal {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 50;
  box-shadow: inset 0 0 100px rgba(255,51,51,0);
  transition: box-shadow 0.5s;
}
#hot-signal.active {
  box-shadow: inset 0 0 150px rgba(255,51,51,0.3);
  animation: hotPulse 2s ease-in-out infinite;
}
@keyframes hotPulse {
  0%, 100% { box-shadow: inset 0 0 100px rgba(255,51,51,0.2); }
  50% { box-shadow: inset 0 0 180px rgba(255,51,51,0.4); }
}

/* ─── MOBILE OPTIMIZATIONS ─── */
@media (max-width: 400px) {
  :root { --knob-size: 140px; }
  #ptt-btn { font-size: 14px; height: 50px; }
  #msg-input { height: 50px; }
}
</style>

<!-- CRT Overlay -->
<div id="crt-overlay"></div>

<!-- Power On Screen -->
<div id="power-screen">
  <div class="power-text">INITIALIZING GHOST FREQUENCY</div>
  <div class="power-bar"><div class="power-bar-fill"></div></div>

</div>

<!-- Main Radio -->
<div id="radio">
  <!-- Frequency Display -->
  <div id="freq-section">
    <div id="app-brand-badge">▼ GHOST FREQUENCY APP</div>

    <div id="freq-display">
      <span id="freq-value">104.5</span><span class="mhz">MHz</span>

  </div>

  <!-- Signal Meter -->
  <div id="meter-section">
    <div id="meter-label">SIG</div>
    <div id="meter">
      <div id="meter-fill"></div>
      <div class="meter-ticks">
        <div class="meter-tick"></div><div class="meter-tick"></div><div class="meter-tick"></div>

        <div class="meter-tick"></div>
      </div>

  <!-- Message Screen -->

  <!-- Knob + Scan -->
  <div id="knob-section">

    <button id="scan-btn" onclick="toggleSetup()" style="border-color:#333; color:#666;">SET</button>

  <!-- PTT -->
  <div id="ptt-section">
    <button id="ptt-btn" 
      onmousedown="handlePTTDown(event)" 
      onmouseup="handlePTTUp(event)" 
      ontouchstart="handlePTTDown(event)" 
      ontouchend="handlePTTUp(event)">
      <span style="display: block;">PUSH TO TALK</span>
      <span style="font-size: 8px; opacity: 0.6; display: block; letter-spacing: 1px; margin-top: 2px;">TAP TO TYPE // HOLD TO SPEAK</span>

  </div>
</div>

<!-- Status Bar -->
<div id="status-bar">
  <span id="status-mode">LIVE AIRWAVES</span>
  <span id="status-count">0 SIGNALS</span>
  <span id="status-loc">NO GPS</span>
</div>

<!-- Settings Modal -->
<div id="setup-modal">
  <div class="setup-box">
    <h2>RADIO SETTINGS</h2>
    
    <label>OPERATOR CALL SIGN</label>
    <input type="text" id="callsign-input" placeholder="GHOST-XXXX" maxlength="16">

    <div class="setting-row">
      <span>STATIC AUDIO NOISE</span>
      <input type="checkbox" id="audio-toggle" checked onchange="toggleAudioSetting()">
    </div>

    <div class="setting-row">
      <span>CRT SCANLINE EFFECT</span>
      <input type="checkbox" id="crt-toggle" checked onchange="toggleCRTSetting()">
    </div>

    <button class="btn-secondary" onclick="shareApp()">SHARE GHOST FREQUENCY</button>
    <button class="btn-close" onclick="toggleSetup()">CLOSE SETTINGS</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   GHOST FREQUENCY — CORE ENGINE
   ═══════════════════════════════════════════ */

// ─── CONFIG ───
const CONFIG = {

};

// ─── STATE ───
let state = {
  frequency: 104.5,
  knobAngle: 0,
  isDragging: false,
  isScanning: false,
  isPTT: false,
  messages: [],
  userLat: null,
  userLng: null,
  supabase: null,
  channel: null,
  audioCtx: null,
  noiseNode: null,
  noiseGain: null,
  audioEnabled: true,
  crtEnabled: true,
  lastKnobTime: 0,
  scanDirection: 1,
  activeUsersOnFreq: 0
};
let mediaRecorder = null;
let audioChunks = [];
let holdTimer = null;
let isRecordingVoice = false;

// ─── DOM REFS ───
const $ = id => document.getElementById(id);
const freqValue = $('freq-value');
const meterFill = $('meter-fill');
const messageScreen = $('message-screen');
const knob = $('knob');
const pttBtn = $('ptt-btn');
const msgInput = $('msg-input');
const statusMode = $('status-mode');
const statusCount = $('status-count');

// ─── SETTINGS TOGGLES ───
function toggleAudioSetting() {
  state.audioEnabled = $('audio-toggle').checked;
  if (!state.audioEnabled && state.noiseGain) {
    state.noiseGain.gain.setValueAtTime(0, state.audioCtx.currentTime);
  } else if (state.audioEnabled) {
    updateSignalMeter();
  }
}

function toggleCRTSetting() {

async function shareApp() {

      await window.Capacitor.Plugins.Share.share({

// ─── AUDIO ENGINE ───
function initAudio() {
  if (state.audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  state.audioCtx = new AudioContext();

  const bufferSize = 2 * state.audioCtx.sampleRate;
  const noiseBuffer = state.audioCtx.createBuffer(1, bufferSize, state.audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1;
  }

  state.noiseNode = state.audioCtx.createBufferSource();
  state.noiseNode.buffer = noiseBuffer;
  state.noiseNode.loop = true;

  const filter = state.audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800;
  filter.Q.value = 0.5;

  state.noiseGain = state.audioCtx.createGain();
  state.noiseGain.gain.value = state.audioEnabled ? 0.3 : 0;

  state.noiseNode.connect(filter);
  filter.connect(state.noiseGain);
  state.noiseGain.connect(state.audioCtx.destination);
  state.noiseNode.start();
}

function setStaticVolume(vol) {
  if (!state.noiseGain || !state.audioEnabled) return;
  state.noiseGain.gain.setTargetAtTime(vol * 0.25, state.audioCtx.currentTime, 0.1);
}

function playBeep(freq = 800, duration = 0.08) {
  if (!state.audioCtx || !state.audioEnabled) return;
  const osc = state.audioCtx.createOscillator();
  const gain = state.audioCtx.createGain();
  osc.frequency.value = freq;
  osc.type = 'square';
  gain.gain.setValueAtTime(0.05, state.audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(state.audioCtx.destination);
  osc.start();
  osc.stop(state.audioCtx.currentTime + duration);
}

// ─── GEOLOCATION ───
function initGeolocation() {
  if (!navigator.geolocation) {
    statusLoc.textContent = 'GPS UNAVAILABLE';
    state.userLat = 40.7128;
    state.userLng = -74.0060;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.userLat = pos.coords.latitude;
      state.userLng = pos.coords.longitude;
      statusLoc.textContent = `GPS LOCK`;
    },
    err => {
      statusLoc.textContent = 'GPS DENIED';
      state.userLat = 40.7128;
      state.userLng = -74.0060;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ─── KNOB PHYSICS ───
function getAngle(cx, cy, ex, ey) {
  const dy = ey - cy;
  const dx = ex - cx;
  let theta = Math.atan2(dy, dx);
  theta *= 180 / Math.PI;
  return theta;
}

function angleToFreq(angle) {
  const minAngle = -135;
  const maxAngle = 135;
  const clamped = Math.max(minAngle, Math.min(maxAngle, angle));
  const pct = (clamped - minAngle) / (maxAngle - minAngle);
  return CONFIG.minFreq + pct * (CONFIG.maxFreq - CONFIG.minFreq);
}

function updateKnob(angle) {
  state.knobAngle = Math.max(-135, Math.min(135, angle));
  knob.style.transform = `rotate(${state.knobAngle}deg)`;
  state.frequency = angleToFreq(state.knobAngle);
  freqValue.textContent = state.frequency.toFixed(1);
  updateSignalMeter();
  updateVisibleMessages();
}

let knobRect, knobCenter;
function recalcKnobCenter() {
  knobRect = knob.getBoundingClientRect();
  knobCenter = {
    x: knobRect.left + knobRect.width / 2,
    y: knobRect.top + knobRect.height / 2
  };
}

knob.addEventListener('mousedown', e => {
  state.isDragging = true;
  recalcKnobCenter();
  initAudio();
  playBeep(600, 0.05);
});

window.addEventListener('mousemove', e => {
  if (!state.isDragging) return;
  const angle = getAngle(knobCenter.x, knobCenter.y, e.clientX, e.clientY);
  updateKnob(angle);
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

knob.addEventListener('touchstart', e => {
  e.preventDefault();
  state.isDragging = true;
  recalcKnobCenter();
  initAudio();
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (!state.isDragging) return;
  const touch = e.touches[0];
  const angle = getAngle(knobCenter.x, knobCenter.y, touch.clientX, touch.clientY);
  updateKnob(angle);
}, { passive: false });

window.addEventListener('touchend', () => {
  state.isDragging = false;
});

// ─── SCAN MODE ───
function toggleScan() {
  state.isScanning = !state.isScanning;
  $('scan-btn').classList.toggle('active', state.isScanning);
  initAudio();
  if (state.isScanning) playBeep(1000, 0.1);
  if (state.isScanning) scanLoop();
}

function scanLoop() {
  if (!state.isScanning) return;
  state.knobAngle += state.scanDirection * 2;
  if (state.knobAngle >= 135) state.scanDirection = -1;
  if (state.knobAngle <= -135) state.scanDirection = 1;
  updateKnob(state.knobAngle);

  const nearby = state.messages.filter(m => Math.abs(m.frequency - state.frequency) < 0.3 && !m.dead);
  if (nearby.length > 0) {
    setTimeout(scanLoop, 800);
  } else {
    requestAnimationFrame(scanLoop);
  }
}

// ─── SIGNAL METER ───
function updateSignalMeter() {
  let strength = 0;
  let count = 0;

  state.messages.forEach(m => {
    if (m.dead) return;
    const freqDiff = Math.abs(m.frequency - state.frequency);
    if (freqDiff < 0.5) {
      const freqFactor = 1 - (freqDiff / 0.5);
      const dist = getDistance(state.userLat, state.userLng, m.lat, m.lng);
      const distFactor = Math.max(0, 1 - (dist / CONFIG.localRange));
      const ageFactor = Math.max(0, 1 - ((Date.now() - m.createdAt) / (CONFIG.decaySeconds * 1000)));
      const sig = freqFactor * distFactor * ageFactor;
      strength = Math.max(strength, sig);
      count++;
    }
  });

  state.activeUsersOnFreq = count;
  meterFill.style.width = (strength * 100) + '%';
  setStaticVolume(1 - strength);

  if (count >= 3) {
    hotSignal.classList.add('active');
    statusCount.textContent = `HOT SIGNAL ×${count}`;
    statusCount.style.color = 'var(--red)';
  } else {
    hotSignal.classList.remove('active');
    statusCount.textContent = `${count} SIGNAL${count!==1?'S':''}`;
    statusCount.style.color = '';
  }
}

// ─── DISTANCE UTIL ───
function getDistance(lat1, lng1, lat2, lng2) {
  if (!lat1 || !lat2) return 0;
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ─── MESSAGE ENGINE ───
function createMessage(data) {
  const msg = {
    id: data.id || crypto.randomUUID(),
    frequency: Number(data.frequency),
    content: data.content,
    audioData: data.audioData,
    lat: data.lat,
    lng: data.lng,
    createdAt: data.createdAt || Date.now(),
    senderId: data.senderId || 'unknown',
    isEcho: data.isEcho || false,
    dead: false,
    el: null,
    decayEl: null
  };

  const recent = state.messages.filter(m =>
    !m.dead &&
    Math.abs(m.frequency - msg.frequency) < 0.3 &&
    Math.abs(m.createdAt - msg.createdAt) < CONFIG.interferenceWindow &&
    m.id !== msg.id
  );
  msg.hasInterference = recent.length > 0;
  if (msg.hasInterference) {
    recent.forEach(r => { r.hasInterference = true; r.interferenceResolved = false; });
    msg.interferenceResolved = false;
    setTimeout(() => {
      msg.interferenceResolved = true;
      recent.forEach(r => r.interferenceResolved = true);
      renderMessageContent(msg);
      recent.forEach(r => renderMessageContent(r));
    }, 3000);
  }

  // Prevent duplicate message entries if reloading existing ID
  if (!state.messages.some(existing => existing.id === msg.id)) {
    state.messages.push(msg);
    renderMessage(msg);
  }
  
  updateSignalMeter();
  updateVisibleMessages();

  // Schedule expiration based on remaining time if loaded from history
  const elapsed = Date.now() - msg.createdAt;
  const remainingLife = (CONFIG.decaySeconds * 1000) - elapsed;

  setTimeout(() => {
    msg.dead = true;
    if (msg.el) {
      msg.el.style.transition = 'opacity 1s';
      msg.el.style.opacity = '0';
      setTimeout(() => msg.el?.remove(), 1000);
    }
    updateSignalMeter();
    updateVisibleMessages();
  }, Math.max(100, remainingLife));

  return msg;
}

function updateVisibleMessages() {
  let visibleCount = 0;
  state.messages.forEach(msg => {
    if (!msg.el) return;
    const freqDiff = Math.abs(msg.frequency - state.frequency);
    if (freqDiff <= 0.4 && !msg.dead) {
      msg.el.style.display = 'block';
      visibleCount++;
    } else {
      msg.el.style.display = 'none';
    }
  });
  $('dead-air').style.display = visibleCount === 0 ? 'flex' : 'none';
}

function garbleText(text, distance) {
  // Cap effective distance scaling so local/nearby messages stay readable
  const effectiveDist = Math.min(distance, 1500); 
  if (effectiveDist < 200) return text;
  
  const garbleChance = Math.min(0.40, (effectiveDist - 200) / (CONFIG.garbleRange - 200));
  const chars = '░▒▓█▚▞▙▟▖▗▘▝▔▂▁▄▀■□▪▫';
  
  return text.split('').map(c => {
    if (c === ' ') return ' ';
    if (Math.random() < garbleChance) {
      return chars[Math.floor(Math.random() * chars.length)];
    }
    return c;
  }).join('');
}

function renderMessage(msg) {
  const el = document.createElement('div');
  el.className = 'message';
  if (msg.isEcho) el.classList.add('echo');
  if (msg.hasInterference && !msg.interferenceResolved) el.classList.add('interference');

  const dist = getDistance(state.userLat, state.userLng, msg.lat, msg.lng);
  const distText = dist < 1000 ? `${Math.round(dist)}m` : `${(dist/1000).toFixed(1)}km`;
  const age = Math.floor((Date.now() - msg.createdAt) / 1000);

  let bodyHTML = msg.audioData 
    ? `<button class="voice-play-btn" onclick="new Audio('${msg.audioData}').play()">▶ PLAY VOICE TRANSMISSION</button>`
    : `<div class="content"></div>`;

  el.innerHTML = `
    <div class="meta">
      <span>${msg.frequency.toFixed(1)} MHz</span>
      <span>${distText}</span>
      <span>${msg.isEcho ? 'ECHO' : age + 's ago'}</span>
    </div>
    ${bodyHTML}
    <div class="decay-bar"></div>
  `;

  msg.el = el;
  msg.decayEl = el.querySelector('.decay-bar');
  messageScreen.prepend(el);
  
  updateVisibleMessages();

  if (!msg.audioData) renderMessageContent(msg);

  requestAnimationFrame(function tick() {
    if (msg.dead || !msg.decayEl) return;
    const elapsed = Date.now() - msg.createdAt;
    const remaining = Math.max(0, 1 - elapsed / (CONFIG.decaySeconds * 1000));
    msg.decayEl.style.transform = `scaleX(${remaining})`;
    
    if (!msg.audioData) {
        const contentEl = msg.el.querySelector('.content');
        if (remaining < 0.5 && Math.random() < 0.05 && contentEl) {
            const text = contentEl.textContent;
            if(text.length > 0) {
              const index = Math.floor(Math.random() * text.length);
              contentEl.textContent = text.substring(0, index) + ' ' + text.substring(index + 1);
            }
        }
        if (remaining < 0.2) {
            msg.el.style.textShadow = `0 0 ${Math.random() * 10 + 5}px var(--phosphor-glow)`;
        }
    }

    if (remaining > 0) requestAnimationFrame(tick);
  });
}

function renderMessageContent(msg) {
  if (!msg.el) return;
  const contentEl = msg.el.querySelector('.content');
  const dist = getDistance(state.userLat, state.userLng, msg.lat, msg.lng);

  if (msg.hasInterference && !msg.interferenceResolved) {
    contentEl.textContent = scrambleText(msg.content);
  } else {
    contentEl.textContent = garbleText(msg.content, dist);
  }
}

function scrambleText(text) {
  const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`';
  return text.split('').map(c => c === ' ' ? ' ' : chars[Math.floor(Math.random() * chars.length)]).join('');
}

// ─── PTT / INPUT ───
function handlePTTDown(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (state.isPTT) return;
  state.isPTT = true;

  holdTimer = setTimeout(() => {
    isRecordingVoice = true;
    startVoiceRecording();
  }, 300); 
}

function handlePTTUp(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }

  if (isRecordingVoice) stopVoiceRecording();
  else if (state.isPTT) openTextInput();
}

function openTextInput() {
  pttBtn.style.display = 'none';
  msgInput.style.display = 'block';
  requestAnimationFrame(() => msgInput.focus());
  playBeep(1200, 0.06);
}

async function startVoiceRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = () => {
        sendTransmission({ audioData: reader.result });
      };
      stream.getTracks().forEach(track => track.stop());
    };

    mediaRecorder.start();
    pttBtn.querySelector('span').textContent = '● RECORDING...';
    pttBtn.style.borderColor = 'var(--red)';
    playBeep(1500, 0.1);
  } catch (err) {
    alert('Microphone access required.');
    resetPTTUI();
  }
}

function stopVoiceRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecordingVoice = false;
  resetPTTUI();
}

function resetPTTUI() {
  state.isPTT = false;
  pttBtn.style.display = 'block';
  pttBtn.style.borderColor = '';
  pttBtn.querySelector('span').textContent = 'PUSH TO TALK';
  msgInput.style.display = 'none';
  msgInput.value = '';
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return resetPTTUI();
  sendTransmission({ content: `[${CONFIG.callSign}] ${text}` });
  resetPTTUI();
}

function sendTransmission({ content = null, audioData = null }) {
  const payload = {
    id: crypto.randomUUID(),
    frequency: state.frequency,
    content: content,
    audioData: audioData,
    lat: state.userLat || 40.7128,
    lng: state.userLng || -74.0060,
    createdAt: Date.now(),
    senderId: CONFIG.deviceId
  };

  if (state.supabase) {
    state.supabase.from('transmissions').insert([{
      frequency: payload.frequency,
      content: payload.content,
      audio_data: payload.audioData,
      lat: payload.lat,
      lng: payload.lng,
      sender_id: payload.senderId
    }]).then(({ error }) => {
      if (error) console.error('Supabase Error:', error);
    });
  }

  createMessage(payload);
  playBeep(900, 0.08);
}

msgInput.addEventListener('blur', () => {
  setTimeout(() => { if (!msgInput.value.trim()) resetPTTUI(); }, 100);
});

// ─── MODAL CONTROLS ───
function toggleSetup() {
  $('setup-modal').classList.toggle('show');
}

async function fetchRecentTransmissions() {
  if (!state.supabase) return;
  
  const fiveMinutesAgo = new Date(Date.now() - (CONFIG.decaySeconds * 1000)).toISOString();

  const { data, error } = await state.supabase
    .from('transmissions')
    .select('*')
    .gte('created_at', fiveMinutesAgo)
    .order('created_at', { ascending: true });

  if (error) {
    console.error('Error fetching past transmissions:', error);
    return;
  }

  if (data) {
    data.forEach(m => {
      if (m.sender_id === CONFIG.deviceId) return;

      createMessage({
        id: m.id,
        frequency: Number(m.frequency),
        content: m.content,
        audioData: m.audio_data,
        lat: m.lat,
        lng: m.lng,
        createdAt: new Date(m.created_at).getTime(),
        senderId: m.sender_id
      });
    });
  }
}

function setupRealtime() {
  if (!state.supabase) return;
  if (state.channel) {
    state.supabase.removeChannel(state.channel);
  }

  state.channel = state.supabase
    .channel('public:transmissions')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'transmissions'
    }, payload => {
      const m = payload.new;
      if (!m || m.sender_id === CONFIG.deviceId) return; 
      
      createMessage({
        id: m.id || crypto.randomUUID(),
        frequency: Number(m.frequency),
        content: m.content,
        audioData: m.audio_data, 
        lat: m.lat,
        lng: m.lng,
        createdAt: m.created_at ? new Date(m.created_at).getTime() : Date.now(),
        senderId: m.sender_id
      });
    })
    .subscribe();
}

// ─── POWER ON SEQUENCE (LIVE-LOCKED) ───
window.addEventListener('load', () => {
  const safetyTimeout = setTimeout(() => {
    const pScreen = $('power-screen');
    if (pScreen && pScreen.style.display !== 'none') {
      pScreen.classList.add('off');
      setTimeout(() => pScreen.style.display = 'none', 1500);
      statusMode.textContent = 'LIVE AIRWAVES';
    }
  }, 3500);

  setTimeout(() => {
    $('power-screen').classList.add('off');
    setTimeout(() => {
      $('power-screen').style.display = 'none';
      clearTimeout(safetyTimeout);
      
      try { initGeolocation(); } catch(e) { console.log('GPS skipped'); }
      try { initAudio(); } catch(e) { console.log('Audio deferred'); }

      try {
        state.supabase = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        setupRealtime();
        fetchRecentTransmissions();
        statusMode.textContent = 'LIVE AIRWAVES';
        statusMode.style.color = 'var(--phosphor)';
        
        setTimeout(triggerWelcomeGhost, 1000);
        initAdMob();

      } catch (e) {
        console.error('Connection failed', e);
      }
    }, 1500);
  }, 2800);
});

async function initAdMob() {
  try {
    const { AdMob, BannerAdPosition, BannerAdSize } = window.Capacitor.Plugins;
    
    await AdMob.initialize({ requestTrackingAuthorization: true });

    await AdMob.showBanner({
      adId: 'ca-app-pub-3940256099942544/6300978111', // Test ID
      position: BannerAdPosition.BOTTOM_CENTER,
      size: BannerAdSize.BANNER,
      margin: 0,
      isTesting: true
    });
  } catch (e) {
    console.log('AdMob not available on web preview', e);
  }
}

// ─── KEYBOARD SHORTCUTS ───
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && document.activeElement !== msgInput) {
    e.preventDefault();
    handlePTTDown();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' && document.activeElement !== msgInput) {
    e.preventDefault();
    handlePTTUp();
  }
});

// ─── PERIODIC UPDATES ───
setInterval(() => {
  state.messages.forEach(m => {
    if (!m.dead && m.el && !m.audioData) {
      renderMessageContent(m);
    }
  });
  updateSignalMeter();
}, 2000);

// ─── SERVICE WORKER (PWA) ───
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('OFFLINE'))));
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
